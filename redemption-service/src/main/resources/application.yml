server:
  port: 8062

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/demoDb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

member:
  service:
    url: ${MEMBER_SERVICE_URL:http://localhost:8061}
